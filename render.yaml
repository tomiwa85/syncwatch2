# Render blueprint for the SyncWatch backend (Docker). Connect the repo in the
# Render dashboard, or use "New + > Blueprint". Set the `sync: false` secrets there.
services:
  - type: web
    name: syncwatch-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "http://localhost:5173"
      - key: ACCESS_TOKEN_TTL
        value: "15m"
      - key: REFRESH_TOKEN_TTL
        value: "30d"
      - key: PORT
        value: "4000"
