appId: com.syncwatch.app
productName: SyncWatch
copyright: Copyright © 2026 SyncWatch

directories:
  output: release
  buildResources: build

# The renderer, main and preload are fully bundled by electron-vite, so the
# packaged app only needs the built output (no runtime node_modules).
files:
  - out/**
  - package.json

# The bundled ffmpeg converter is copied into the app's resources dir.
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SyncWatch

# Templates for other platforms (build on the matching OS):
mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.entertainment

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: AudioVideo
