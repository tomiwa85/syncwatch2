name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --no-frozen-lockfile --filter "@syncwatch/client..."

      - name: Build web bundle
        run: pnpm --filter @syncwatch/client build:web

      - name: Generate Android project
        working-directory: packages/client
        run: |
          npx cap add android
          npx cap sync android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0B0F1A' --iconBackgroundColorDark '#0B0F1A' --splashBackgroundColor '#0B0F1A' --splashBackgroundColorDark '#0B0F1A' || echo "::warning::icon/splash generation skipped (using defaults)"
          node -e "const fs=require('fs');const p='android/app/src/main/AndroidManifest.xml';let x=fs.readFileSync(p,'utf8');if(!x.includes('android:screenOrientation')){x=x.replace(/<activity\b/, '<activity\n            android:screenOrientation=\"fullUser\"');fs.writeFileSync(p,x);console.log('rotation enabled')}" || echo "::warning::manifest rotation patch skipped"

      - name: Build debug APK
        working-directory: packages/client/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncWatch-android-debug
          path: packages/client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
