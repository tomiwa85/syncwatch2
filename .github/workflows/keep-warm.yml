name: Keep server warm

on:
  schedule:
    - cron: "*/10 * * * *"   # every ~10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend so Render doesn't spin it down
        run: |
          curl -sS -o /dev/null -w "ping %{http_code} in %{time_total}s\n" \
            https://syncwatch-server-szu2.onrender.com/api/rooms || true
