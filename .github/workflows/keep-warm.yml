name: Keep server warm

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub treats this as best-effort; see note below
  workflow_dispatch:

# NOTE: GitHub delays/skips scheduled runs heavily on free repos (observed gaps of
# 3-7 hours), so this alone can't keep a free Render instance awake. Pair it with
# a backup. The server also pings itself every 10 minutes (src/keep-alive.ts).
# Use /api/ping, never /api/health, for pings: /api/health wakes the database.

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (server only — the DB is left to sleep)
        run: |
          curl -sS -o /dev/null -w "ping %{http_code} in %{time_total}s\n" \
            --max-time 90 https://syncwatch-server-szu2.onrender.com/api/ping || true
